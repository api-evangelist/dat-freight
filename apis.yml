name: DAT Freight & Analytics
kind: company
description: >-
  DAT Freight & Analytics operates the largest truckload freight marketplace in
  North America - the DAT One load board - along with RateView, the industry's
  benchmark for spot and contract freight rates drawn from hundreds of billions
  of dollars in real transactions. DAT exposes these products to Transportation
  Management Systems (TMS) and freight platforms through the DAT Developer
  Portal (developer.dat.com), a RESTful API suite covering load posting and
  search, RateView rate lookups, BookNow instant booking, and shipment
  tracking. Access is subscription-gated: RESTful integration requires a DAT One
  load board subscription and a service (organization) account, and RateView
  access requires a Combo Pro or Combo Premium plan. Every request is
  authenticated with a two-tier token model - an organization token issued from
  service-account credentials plus a user token for the account making the call.
