description: >-
  FinOps view of DAT spend. DAT API access is not billed as a standalone metered
  product - it rides on a DAT One product subscription. The dominant cost drivers
  are per-user load board and RateView subscription seats (Combo Pro or Combo
  Premium for RateView), a possible one-time integration setup fee, and, where
  applicable, transaction fees on booked loads. Because pricing is quote-based
  and the developer portal is account-gated, per-unit rates are not reconciled
  here and should come from a DAT sales quote.
notes: >-
  Third-party estimates (setup ~$500-$1,000; ~$50-$300/user/month; ~0.5-1% per
  load) are not confirmed DAT list prices. Cost is driven by seat count and
  product tier rather than by API call volume.
sources:
