meters:
- name: load_board_seats
  description: Per-user DAT One load board subscription seats enabling load search and posting APIs.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - user
- name: rateview_seats
  description: RateView Combo Pro/Premium seats enabling the Rate Lookup API.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - user
- name: setup_fee
  description: One-time integration/setup charge (estimate; confirm with DAT).
  unit: contracts
  aggregation: sum
  dimensions:
  - account
- name: booked_loads
  description: Loads booked (e.g. via BookNow) where transaction fees may apply.
  unit: loads
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track seat counts by product (load board vs RateView) and tier; attribute the one-time setup fee.
- name: Allocation
  description: Map load board and RateView seats to the teams and workflows that consume the APIs.
- name: Optimization
  description: Right-size seat counts to active integration users; choose RateView Combo Pro vs Premium by required rate history and analytics depth.
- name: Accountability
  description: Assign an owner for the DAT contract; review seat utilization and any per-load transaction fees against budget each billing cycle.
